<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book A Session | Meridian</title>

<link rel="stylesheet" href="/css/home.css">
</head>

<body>

<header class="topbar">

<div class="container nav">

<a href="/" class="logo">MERIDIAN</a>

<nav class="nav-links show">
<a href="/">Home</a>
<a href="/pages/services.html">Services</a>
<a href="/pages/contact.html">Contact</a>
</nav>

</div>

</header>

<section class="featured-services" style="padding-top:180px;">

<div class="container narrow">

<div class="section-heading">

<span>BOOK A SESSION</span>

<h2>Reserve Your Experience</h2>

</div>

<form id="bookingForm">

<input type="text" name="name" placeholder="Full Name" required>

<br><br>

<input type="email" name="email" placeholder="Email Address" required>

<br><br>

<input type="tel" name="phone" placeholder="Phone Number" required>

<br><br>

<select name="service" required>

<option value="">Choose A Service</option>

<option>Meridian Reset</option>
<option>Flowline Ritual</option>
<option>The Drift</option>
<option>Combustion Point</option>
<option>Headwind</option>
<option>Root Layer</option>
<option>PulseLine Protocol</option>
<option>The Compass</option>

</select>

<br><br>

<textarea name="notes" rows="6" placeholder="Notes"></textarea>

<br><br>

<button type="submit" class="gold-btn">
Submit Booking Request
</button>

</form>

</div>

</section>

<script>
document.getElementById("bookingForm").addEventListener("submit", async (e) => {

e.preventDefault();

const form = new FormData(e.target);

const payload = Object.fromEntries(form.entries());

const response = await fetch("/api/book", {
method: "POST",
headers: {
"Content-Type":"application/json"
},
body: JSON.stringify(payload)
});

const result = await response.json();

alert(result.message || "Booking submitted.");

});
</script>

</body>
</html>
